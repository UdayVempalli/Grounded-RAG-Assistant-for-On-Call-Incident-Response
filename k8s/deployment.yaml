apiVersion: apps/v1
kind: Deployment
metadata:
  name: runbookqa-api
  labels:
    app: runbookqa-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runbookqa-api
  template:
    metadata:
      labels:
        app: runbookqa-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # matches USER 1000 in the Dockerfile
        runAsGroup: 1000
        fsGroup: 1000     # makes the feedback PVC writable by the app user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Tag is set in kustomization.yaml (images:), one place per release.
          image: runbookqa-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: RUNBOOKQA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runbookqa-secret
                  key: RUNBOOKQA_API_KEY
            - name: RUNBOOKQA_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: runbookqa-secret
                  key: RUNBOOKQA_ADMIN_KEY
                  optional: true   # unset -> /ingest disabled (503)
            - name: RUNBOOKQA_FEEDBACK_PATH
              value: /code/data/feedback/feedback.jsonl
            - name: RUNBOOKQA_RATE_LIMIT
              value: "10"
            - name: RUNBOOKQA_RATE_WINDOW_S
              value: "60"
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          # Read-only root: the only writes go to the feedback PVC and /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: feedback
              mountPath: /code/data/feedback
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: feedback
          persistentVolumeClaim:
            claimName: runbookqa-feedback
        - name: tmp
          emptyDir: {}
---
# Feedback survives pod restarts. ReadWriteOnce matches replicas: 1; going
# multi-replica means moving feedback to a shared store (see README, Future work).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runbookqa-feedback
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
