# Template: replace change-me with a real key before applying.
# Never commit a real key. Generate one with: python -c "import secrets; print(secrets.token_urlsafe(32))"
apiVersion: v1
kind: Secret
metadata:
  name: runbookqa-secret
type: Opaque
stringData:
  RUNBOOKQA_API_KEY: change-me-to-a-long-random-secret
