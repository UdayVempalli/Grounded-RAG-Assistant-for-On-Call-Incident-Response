name: eval-nightly

# Full golden set (gates) + held-out set (measures, never gates). ~1h+ on a
# CPU runner, so it runs nightly and on demand rather than on every push.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  eval-full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/eval-setup

      - name: "full golden set (gate: no failures outside evals/known_failures.json)"
        run: python -m app.eval --json-out eval-golden.json

      # Runs even when the golden gate fails: the held-out number is the
      # honest one and must be reported every night.
      - name: held-out set (measurement only, never gates)
        if: always()
        run: python -m app.eval --golden evals/holdout.json --report-only --json-out eval-holdout.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-nightly
          path: eval-*.json
          if-no-files-found: ignore

      - name: fix model cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/ollama-models
