name: eval-gate

# Fast LLM gate: a fixed stratified sample (1 question per runbook + every
# refusal and prompt-injection item, ~30 items) instead of all 135. The full
# set and the held-out set run nightly (eval-nightly.yml). Only runs when
# something that can change answers changes.
on:
  push:
    paths:
      - "app/**"
      - "evals/**"
      - "data/runbooks/**"
      - "requirements*.txt"
      - ".github/workflows/eval.yml"
      - ".github/actions/eval-setup/**"
  pull_request:
    paths:
      - "app/**"
      - "evals/**"
      - "data/runbooks/**"
      - "requirements*.txt"
      - ".github/workflows/eval.yml"
      - ".github/actions/eval-setup/**"

# A newer push supersedes an eval still running on the same branch.
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/eval-setup

      - name: "eval sample (gate: no failures outside evals/known_failures.json)"
        run: python -m app.eval --sample --json-out eval-sample.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-sample
          path: eval-sample.json
          if-no-files-found: ignore

      # Ollama wrote the model cache as root; hand it to the runner user so
      # the cache post-step can archive it.
      - name: fix model cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/ollama-models
