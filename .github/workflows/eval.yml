name: eval-gate

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install CPU-only torch first
        run: |
          TORCH_VER=$(grep '^torch==' requirements-lock.txt | cut -d= -f3)
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VER}"

      - run: pip install -r requirements-lock.txt
      - run: pip install -r requirements-dev.txt

      - name: run unit + API tests
        run: python -m pytest tests/ -v

      - name: start qdrant
        run: docker run -d -p 6333:6333 qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad

      - name: start ollama
        run: |
          docker run -d -p 11434:11434 --name ollama ollama/ollama:latest
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:11434/api/tags > /dev/null || { echo "ollama did not start"; exit 1; }
          docker exec ollama ollama pull llama3.2:3b

      - name: ingest runbooks
        run: python -m app.ingest

      - name: run eval harness (regressions break the build)
        run: python -m app.eval
