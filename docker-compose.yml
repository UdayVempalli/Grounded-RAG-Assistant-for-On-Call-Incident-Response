services:
  qdrant:
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    volumes:
      - ./data/runbooks:/code/data/runbooks:ro
      # Feedback outlives the container; gitignored on the host.
      - ./data/feedback:/code/data/feedback
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      - RUNBOOKQA_API_KEY=${RUNBOOKQA_API_KEY:?set RUNBOOKQA_API_KEY in .env}
      # Optional: unset leaves POST /ingest disabled (503).
      - RUNBOOKQA_ADMIN_KEY=${RUNBOOKQA_ADMIN_KEY:-}
    depends_on:
      - qdrant

  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml

  grafana:
    image: grafana/grafana@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:?set GRAFANA_USER in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning

volumes:
  qdrant_data:
